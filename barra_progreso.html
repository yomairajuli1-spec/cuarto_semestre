<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Barra de progreso</title>
    <link rel="stylesheet" href="barra_progreso.css">
</head>
<body>
    <div class="progressbar-container">
        <div class="outer-box">
            <div class="inner-box">50%</div>
            <svg xmls="http://www.w3.org/2000/svg" 
            version="1.1"
            width="200"
            height="200"

            >
            <defs>
                <lineargradient id="gradientColor">
                    <stop offset="0%" stop_color="#e91e63"/>
                    <stop offset="100%" stop_color="#673ab7"/>

                </lineargradient>
            </defs>
            
            <circle cx="100" cy="100" r="80" stroke-linecap="round"/>


            </svg>
        </div>
    </div> 
</body>
</html>
