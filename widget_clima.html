<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clima</title>
    <!-- Enlace para cargar Google Material Icons -->
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <link rel="stylesheet" href="widget_clima.css"/>
</head>
<body>

    <div class="weather-container">
        <div class="current">
            <div class="city">Peru city</div>
            <div class="day">Now</div>
            <div class="row">
                <div class="icon">
                    <img src="imagenes/iconclima_files" width="128 px" alt=""/>
                </div>
                <div class="info">
                    <div class="temperature">
                        <div class="temperature-now">20°</div>
                        <div class="temperature-low">17°</div> 
                    </div>
                    <div class="status">Partially Iconclima</div>
                </div>
            </div>

            <div class="more">
                <div class="item">
                    <div class="icon">
                        <span class="material-icons">air</span>
                    </div>
                    <div class="text">
                        <div class="value">9 km/h</div>
                        <div class="type">wind</div>
                    </div>
                </div>

                <div class="item">
                    <div class="icon">
                        <span class="material-icons">water_drop</span>
                    </div>
                    <div class="text">
                        <div class="value">93 %</div>
                        <div class="type">Changes of rain</div>
                    </div>
                </div>

                <div class="item">
                    <div class="icon">
                        <span class="material-icons">water</span>
                    </div>
                    <div class="text">
                        <div class="value">31%</div>
                        <div class="type">Humidity</div>
                    </div>
                </div>
            </div>
        </div>

        <div class="list">
            <div class="day">
                <div class="name">tue</div>
                <div class="weather">
                    <div class="icon">
                        <span class="material-icons">air</span>
                    </div>
                    <div class="status">Wind power</div>
                </div>
                <div class="temperature">
                    <div class="temperature-high">20°</div>
                    <div class="temperature-low">17°</div>
                </div>
            </div>

            <div class="day">
                <div class="name">wed</div>
                <div class="weather">
                    <div class="icon">
                        <span class="material-icons">thunderstorm</span>
                    </div>
                    <div class="status">Thunderstorm</div>
                </div>
                <div class="temperature">
                    <div class="temperature-high">20°</div>
                    <div class="temperature-low">17°</div>
                </div>
            </div>

            <div class="day">
                <div class="name">Thu</div>
                <div class="weather">
                    <div class="icon">
                        <span class="material-icons">partly_cloudy_day</span>
                    </div>
                    <div class="status">Partially sunny</div>
                </div>
                <div class="temperature">
                    <div class="temperature-high">20°</div>
                    <div class="temperature-low">17°</div>
                </div>
            </div>

            <div class="day">
                <div class="name">Fri</div>
                <div class="weather">
                    <div class="icon">
                        <span class="material-icons">wb_sunny</span>
                    </div>
                    <div class="status">Sunny</div>
                </div>
                <div class="temperature">
                    <div class="temperature-high">25°</div>
                    <div class="temperature-low">17°</div>
                </div>
            </div>
        </div>
    </div>
    
</body>
</html>
